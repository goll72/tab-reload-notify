<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" value="dark light">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <form>
    <h3>General Settings</h3>

    <label>
      <input type="checkbox" name="reload-removed">
      Reload tabs when a file is removed
    </label>

    <hr>

    <h3>Regex List</h3>

    <p>Use regex list as:</p>

    <div>
      <label>
        <input type="radio" name="list-type" value="block" checked>
        Blocklist
      </label>
    </div>

    <div>
      <label>
        <input type="radio" name="list-type" value="allow">
        Allowlist
      </label>
    </div>

    <div id="regex-list-container">
      <p>List of regexes that should match:</p>

      <textarea rows="8" id="regex-list" name="regex-list" autocomplete="off" spellcheck="false"
        placeholder="Insert one regex per line...&#10;  (don't match on the file:// prefix)&#10;Comment by starting a line with '#'"></textarea>
    </div>

    <div id="regex-errors"></div>

    <hr>

    <button type="submit" id="save">Save</button>
  </form>

  <script type="module" src="options.js"></script>
</body>

</html>
