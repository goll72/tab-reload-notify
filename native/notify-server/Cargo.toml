[package]
name = "notify-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
notify = "9.0.0-rc.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[profile.release]
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
codegen-units = 1

[build-dependencies]
embed-resource = "3.0.6"
